databases:
  - name: reposcope-db
    databaseName: reposcope
    user: reposcope_user
    plan: free

services:
  - type: web
    name: reposcope-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2
    envVars:
      - key: APP_ENV
        value: production
      - key: DEMO_MODE
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: reposcope-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: METHODOLOGY_VERSION
        value: "2.1.0"
      - key: FRONTEND_ORIGIN
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.7

